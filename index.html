<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>다 했어요 할 일 앱</title>
<meta name="description" content="아침과 저녁에 할 일을 아이가 한 번 터치해서 표시하고, 걸린 시간을 기록하는 앱">
<meta name="theme-color" content="#FFD84D">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="다 했어요">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<style>
:root {
  /* 아침은 햇살 노랑, 저녁은 밤하늘 남색. 아이마다 자기 색의 줄이 있고 할 일은 큰 그림 타일. 한 가지 모습으로만 그린다. */
  --ink: #1F2440;
  --ink-soft: #4A5070;
  --ground: #F4F7FB;
  --sun: #FFD84D;
  --sun-deep: #F2BE1F;
  --night: #171C3F;
  --night-bar: #262E66;
  --go: #0A8540;
  --card: #FFFFFF;
  --line: #E3E8F1;
  --font-display: 'Jua', 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', sans-serif;
  --font-body: system-ui, -apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', sans-serif;
  color-scheme: light;
}
/* 아이 색: 진한 색(테두리·막대), 옅은 바탕, 완료 타일, 연한 막대 */
.blue { --tone: #2463EB; --tint: #DCE9FF; --fill: #BFD6FF; --soft: #8FB4FF; }
.orange { --tone: #F08519; --tint: #FFE9CC; --fill: #FFD39A; --soft: #FFC98A; }
.green { --tone: #1C9A4E; --tint: #DDF3E4; --fill: #BDE7CB; --soft: #8FD3A8; }
.pink { --tone: #E5488B; --tint: #FFE1EE; --fill: #FFC4DC; --soft: #F8A3C6; }
.purple { --tone: #7C5CE0; --tint: #E9E3FF; --fill: #D3C8FA; --soft: #B3A2F2; }
.teal { --tone: #0B98A6; --tint: #D9F2F5; --fill: #B5E4EA; --soft: #86CED8; }
.red { --tone: #DD4233; --tint: #FFE3DF; --fill: #FFC7BF; --soft: #F4A398; }
.yellow { --tone: #D99A00; --tint: #FFF3C9; --fill: #FFE48F; --soft: #F3CE5A; }

* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--ground); color: var(--ink); font-family: var(--font-body); overflow: hidden;
  -webkit-text-size-adjust: 100%; -webkit-tap-highlight-color: transparent;
  -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; touch-action: manipulation;
}
button { font: inherit; color: inherit; border: 0; background: none; padding: 0; margin: 0; cursor: pointer; touch-action: manipulation; }
button:disabled { opacity: .45; cursor: default; }
input, textarea { font: inherit; color: inherit; -webkit-user-select: text; user-select: text; }
:focus-visible { outline: 3px solid var(--ink); outline-offset: 2px; }
h1, h2, h3, p { margin: 0; }
svg { display: block; }
.sprite { position: absolute; width: 0; height: 0; overflow: hidden; }
.grow { flex: 1 1 0; }
#app { height: 100%; --u: 8px; --w: 1180px; }
.ava { display: block; flex: 0 0 auto; aspect-ratio: 1; border-radius: 50%; overflow: hidden; background: var(--tint); border: 3px solid var(--tone); }
.ava svg { width: 100%; height: auto; aspect-ratio: 1 / 1; }

/* ---------- 아침·저녁 판 ---------- */
.board {
  height: 100%; display: flex; flex-direction: column; background: var(--ground); font-family: var(--font-display);
  --top: clamp(58px, calc(var(--u) * 13.6), 118px);
  --gap: clamp(8px, calc(var(--u) * 2.2), 20px);
  --pad: clamp(8px, calc(var(--u) * 1.9), 16px);
  --r: clamp(16px, calc(var(--u) * 3.2), 28px);
  --fs-clock: clamp(26px, calc(var(--u) * 5.9), 50px);
  --fs-date: clamp(14px, calc(var(--u) * 3.2), 27px);
  --fs-seg: clamp(17px, calc(var(--u) * 3.4), 29px);
  --bd: clamp(3px, calc(var(--u) * 0.6), 5px);
  --side-l: max(16px, env(safe-area-inset-left));
  --side-r: max(16px, env(safe-area-inset-right));
}
.board.pm { background: var(--night); }
.top {
  flex: 0 0 auto; min-height: calc(var(--top) + env(safe-area-inset-top)); padding: env(safe-area-inset-top) var(--side-r) 0 var(--side-l);
  display: flex; align-items: center; justify-content: space-between; gap: var(--gap); background: var(--sun);
}
.pm .top { background: var(--night-bar); color: #FFFFFF; }
.seg { display: flex; gap: calc(var(--u) * 0.7); padding: calc(var(--u) * 0.7); border-radius: calc(var(--r) * 0.95); background: var(--sun-deep); }
.pm .seg { background: var(--night); }
.segbtn {
  height: clamp(44px, calc(var(--u) * 7.8), 66px); padding: 0 calc(var(--u) * 2.6) 0 calc(var(--u) * 1.4);
  display: flex; align-items: center; gap: calc(var(--u) * 0.9); border-radius: calc(var(--r) * 0.72); font-size: var(--fs-seg); white-space: nowrap;
}
.segbtn svg { width: 1.6em; height: 1.6em; }
.segbtn.on { background: #FFFFFF; color: var(--ink); }
.when { display: flex; flex-direction: column; align-items: center; gap: 2px; white-space: nowrap; }
.date { display: flex; align-items: center; justify-content: center; gap: .45em; font-size: var(--fs-date); line-height: 1.15; }
.kchip { display: inline-flex; align-items: center; gap: .3em; min-height: clamp(28px, calc(var(--u) * 4.6), 42px); padding: 0 .7em 0 .35em; border-radius: 999px; background: #FFFFFF; color: var(--ink); font-size: .9em; white-space: nowrap; }
.kchip svg { width: 1.5em; height: 1.5em; }
.tight1 .kchip { padding: 0 .35em; }
.tight1 .kchip span, .tight2 .wd, .tight3 .timer .t0 { display: none; }
.clock { font-size: var(--fs-clock); line-height: 1.05; font-variant-numeric: tabular-nums; }
.tools { display: flex; align-items: center; gap: calc(var(--u) * 1.4); }
.start, .timer { height: clamp(48px, calc(var(--u) * 8.8), 74px); display: flex; align-items: center; gap: calc(var(--u) * 1.1); border-radius: 999px; white-space: nowrap; }
.start { padding: 0 calc(var(--u) * 3.4) 0 calc(var(--u) * 2.6); background: var(--go); color: #FFFFFF; font-size: clamp(24px, calc(var(--u) * 4.4), 36px); box-shadow: 0 4px 0 #06602D; }
.start svg { width: .9em; height: .9em; }
.start.pulse { animation: pulse 1.6s ease-in-out infinite; }
.start.shake { animation: shake .5s; }
.timer { padding: 0 calc(var(--u) * 2.4); border: var(--bd) solid var(--go); background: #FFFFFF; color: var(--ink); }
.timer svg { width: clamp(16px, calc(var(--u) * 3.2), 26px); height: clamp(16px, calc(var(--u) * 3.2), 26px); }
.timer .t0 { font-size: clamp(14px, calc(var(--u) * 2.9), 24px); }
.timer .tn { font-size: clamp(18px, calc(var(--u) * 3.9), 32px); color: var(--go); font-variant-numeric: tabular-nums; }
.ibtn { width: clamp(44px, calc(var(--u) * 7.8), 64px); height: clamp(44px, calc(var(--u) * 7.8), 64px); display: grid; place-items: center; border-radius: calc(var(--r) * 0.72); background: var(--sun-deep); position: relative; overflow: hidden; }
.pm .ibtn { background: #3A4380; color: #FFFFFF; }
.ibtn svg { width: 50%; height: 50%; }

/* 줄 배치: 아이 수와 화면 크기에 맞춰 스크립트가 --lcols, --tcols, --u, --uh 등을 정한다 */
.lanes {
  flex: 1 1 0; min-height: 0; display: grid; grid-template-columns: repeat(var(--lcols, 1), minmax(0, 1fr)); grid-auto-rows: minmax(0, 1fr); gap: var(--gap);
  padding: var(--gap) var(--side-r) max(var(--gap), env(safe-area-inset-bottom)) var(--side-l);
  --uh: var(--u); --up: var(--uh);
  --bd: clamp(3px, calc(var(--u) * 0.6), 5px);
  --tr: clamp(12px, calc(var(--u) * 3.2), 28px);
  --tgap: clamp(6px, calc(var(--u) * 1.4), 14px);
  --fs-lbl: clamp(12px, calc(var(--u) * 2.95), 26px);
  --fs-chip: clamp(11px, calc(var(--u) * 2.4), 22px);
}
.lanes.scroll { grid-auto-rows: var(--lane-h, 136px); align-content: start; overflow-y: auto; -webkit-overflow-scrolling: touch; touch-action: pan-y; }
.lane { min-width: 0; min-height: 0; display: flex; gap: var(--pad); padding: var(--pad); border-radius: calc(var(--r) * 1.2); background: var(--tint); }
.head-top .lane { flex-direction: column; gap: calc(var(--pad) * 0.6); }
.kid { flex: 0 0 auto; min-width: 0; width: var(--kid-w, clamp(66px, calc(var(--w) * 0.112), 136px)); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: calc(var(--uh) * 0.8); }
.head-top .kid { width: auto; flex-direction: row; justify-content: flex-start; gap: calc(var(--uh) * 1.6); }
.lane .ava { width: min(100%, clamp(40px, calc(var(--uh) * 13.2), var(--ava-max, 112px))); border-width: clamp(3px, calc(var(--uh) * 0.6), 6px); }
.head-top .lane .ava { width: clamp(30px, calc(var(--uh) * 8.2), 70px); }
.solo { --ava-max: 170px; }
.name { font-size: var(--fs-name, clamp(16px, calc(var(--uh) * 4.6), 40px)); line-height: 1.1; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.count { display: flex; align-items: center; gap: .25em; padding: .1em .6em .1em .3em; border-radius: 999px; background: #FFFFFF; font-size: var(--fs-count, clamp(12px, calc(var(--uh) * 2.9), 26px)); white-space: nowrap; }
.count svg { width: 1.25em; height: 1.25em; }
.tight:not(.head-top) .count { display: none; }
.mini { min-height: 32px; padding: 0 .8em; border-radius: 999px; background: #FFFFFF; font-size: clamp(12px, calc(var(--uh) * 2.2), 18px); white-space: nowrap; }

.tiles { flex: 1 1 0; min-width: 0; min-height: 0; display: grid; grid-template-columns: repeat(var(--tcols, var(--tc)), minmax(0, 1fr)); grid-auto-rows: minmax(0, 1fr); gap: var(--tgap); }
.tiles.n6 { --tc: 6; }
.tiles.n5 { --tc: 5; }
.tiles.n3 { --tc: 3; }
.tile {
  position: relative; min-width: 0; min-height: 0; display: flex; flex-direction: column; align-items: center; gap: calc(var(--u) * 0.6);
  padding: calc(var(--u) * 1.8) calc(var(--u) * 0.6) calc(var(--u) * 1); border: var(--bd) solid #FFFFFF; border-radius: var(--tr);
  background: #FFFFFF; transition: transform .12s;
}
.tile:active { transform: scale(.96); }
.tile.done { background: var(--fill); border-color: var(--tone); }
.tile .pic { flex: 1 1 0; min-height: 0; width: 100%; }
.tile .lbl { flex: 0 0 auto; font-size: var(--fs-lbl); line-height: 1.16; text-align: center; white-space: nowrap; }
.lbl .l1 { display: none; }
.lbl-one .lbl .l1 { display: inline; }
.lbl-one .lbl .l2 { display: none; }
.tile .chip { flex: 0 0 auto; padding: 0 .7em; border-radius: 999px; background: #FFFFFF; font-size: var(--fs-chip); line-height: 1.4; visibility: hidden; }
.tile.done .chip { visibility: visible; }
.no-chip .tile .chip { display: none; }
.sticker { position: absolute; top: calc(var(--u) * -1.7); right: calc(var(--u) * -1.5); width: clamp(26px, calc(var(--u) * 7.4), 62px); height: clamp(26px, calc(var(--u) * 7.4), 62px); pointer-events: none; }
.n3 .sticker { width: clamp(30px, calc(var(--u) * 9.2), 78px); height: clamp(30px, calc(var(--u) * 9.2), 78px); }
.tile.just .sticker { animation: pop .45s cubic-bezier(.2, 1.6, .4, 1); }
.tile.late { border-color: #E5484D; animation: late 1s ease-in-out infinite; }
.tile.late .sticker { animation: wiggle .45s ease-in-out infinite; }

.party {
  flex: 1 1 0; min-width: 0; min-height: 0; position: relative; overflow: hidden; display: flex; align-items: center; justify-content: space-between;
  gap: calc(var(--up) * 3); padding: 0 calc(var(--up) * 3.4); border: var(--bd) solid var(--tone); border-radius: var(--tr); background: #FFFFFF;
}
.stamp { flex: 0 0 auto; width: calc(var(--up) * 25); height: calc(var(--up) * 25); display: grid; place-items: center; border: calc(var(--up) * 1) solid #D32B21; border-radius: 50%; transform: rotate(-10deg); color: #D32B21; }
.stamp > div { width: 84%; height: 84%; display: grid; place-items: center; border: calc(var(--up) * 0.36) solid #D32B21; border-radius: 50%; font-size: calc(var(--up) * 4.6); line-height: 1.12; text-align: center; }
.party.fresh .stamp { animation: stamp .5s cubic-bezier(.2, 1.4, .4, 1) both; }
.msg { flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; align-items: flex-start; gap: calc(var(--up) * 1.1); }
.msg .big { max-width: 100%; font-size: clamp(18px, calc(var(--up) * 5.6), 60px); line-height: 1.1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.msg .sub { font-size: clamp(12px, calc(var(--up) * 2.95), 30px); line-height: 1.25; color: var(--ink-soft); word-break: keep-all; }
.stars { display: flex; gap: calc(var(--up) * 0.5); }
.stars svg { width: clamp(16px, calc(var(--up) * 5.2), 52px); height: clamp(16px, calc(var(--up) * 5.2), 52px); }
.ghost { min-height: 44px; padding: 0 1.1em; border: 3px solid #C9D3E6; border-radius: 999px; background: #FFFFFF; color: var(--ink-soft); font-family: var(--font-display); font-size: clamp(13px, calc(var(--up) * 2.5), 22px); white-space: nowrap; position: relative; overflow: hidden; }
.trophy { flex: 0 1 auto; min-width: 0; width: calc(var(--up) * 27); height: calc(var(--up) * 27); }
.narrow .stars, .tight .stars, .tight .msg .sub, .slim .trophy { display: none; }
.tight .ghost { min-height: 34px; }
.tight .msg { gap: 3px; }
.confetti { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
.confetti i { position: absolute; top: -10%; width: calc(var(--up) * 1.3); height: calc(var(--up) * 2.1); min-width: 5px; min-height: 8px; border-radius: 2px; animation: fall 2s ease-in forwards; }

.offday { grid-column: 1 / -1; min-height: 0; display: flex; align-items: center; justify-content: center; gap: calc(var(--u) * 5); padding: var(--pad) calc(var(--u) * 4); border-radius: calc(var(--r) * 1.2); background: #FFF3C4; }
.offday .opic { flex: 0 1 auto; min-width: 0; width: calc(var(--u) * 34); height: calc(var(--u) * 34); max-height: 80%; }
.offday .big { font-size: clamp(28px, calc(var(--u) * 7.4), 64px); line-height: 1.1; }
.offday .sub { font-size: clamp(15px, calc(var(--u) * 3.3), 28px); color: var(--ink-soft); margin-top: calc(var(--u) * 1.2); }
.offday .orow { display: flex; flex-wrap: wrap; gap: 12px; margin-top: calc(var(--u) * 3); }
.offday .ghost { font-size: clamp(14px, calc(var(--u) * 2.5), 20px); }
.offday.choose { flex-direction: column; align-items: stretch; justify-content: center; gap: calc(var(--u) * 2.2); padding: calc(var(--u) * 2) calc(var(--u) * 3); }
.chead { display: flex; align-items: baseline; justify-content: center; flex-wrap: wrap; gap: 0 calc(var(--u) * 2.4); text-align: center; }
.choose .big { font-size: clamp(20px, calc(var(--u) * 4.8), 42px); }
.choose .sub { margin-top: 0; font-size: clamp(13px, calc(var(--u) * 2.9), 24px); }
.choose .orow { margin-top: 0; justify-content: center; }
.kinds { min-height: 0; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--gap); }
.kind { min-width: 0; display: flex; align-items: center; justify-content: center; gap: calc(var(--u) * 2.6); padding: calc(var(--u) * 2.4); border: var(--bd) solid #FFFFFF; border-radius: var(--r); background: #FFFFFF; box-shadow: 0 calc(var(--u) * 0.6) 0 #EBCB55; font-family: var(--font-display); transition: transform .12s; }
.kind:active { transform: scale(.97); }
.kind.on { border-color: var(--ink); }
.kpic { flex: 0 0 auto; width: clamp(54px, calc(var(--u) * 23), 210px); height: clamp(54px, calc(var(--u) * 23), 210px); }
.ktxt { min-width: 0; display: flex; flex-direction: column; align-items: flex-start; gap: calc(var(--u) * 1.4); }
.ktxt b { font-weight: 400; font-size: clamp(19px, calc(var(--u) * 4.9), 44px); line-height: 1.1; white-space: nowrap; }
.kminis { display: flex; gap: calc(var(--u) * 0.5); }
.kminis svg { width: clamp(20px, calc(var(--u) * 5.6), 50px); height: clamp(20px, calc(var(--u) * 5.6), 50px); }
@media (min-height: 600px) {        /* 태블릿처럼 세로로 넉넉한 화면: 그림을 위에, 글을 아래에 두어 크게 */
  .choose .kind { flex-direction: column; gap: calc(var(--u) * 1.6); }
  .choose .kpic { width: calc(var(--u) * 30); height: calc(var(--u) * 30); }
  .choose .ktxt { align-items: center; }
}
.portrait .choose .kind { flex-direction: row; gap: calc(var(--u) * 2.6); }
.portrait .choose .ktxt { align-items: flex-start; }
.primary { min-height: 52px; padding: 0 1.3em; border-radius: 999px; background: var(--night-bar); color: #FFFFFF; font-family: var(--font-display); font-size: clamp(16px, calc(var(--u) * 3), 24px); white-space: nowrap; }

/* 세로로 들었을 때: 줄을 위아래로 쌓고 밀어서 본다 */
.portrait .top { flex-wrap: wrap; row-gap: 8px; padding-top: calc(env(safe-area-inset-top) + 10px); padding-bottom: 10px; }
.portrait .when { order: 3; flex: 1 0 100%; flex-direction: row; justify-content: center; align-items: baseline; gap: 12px; }
.portrait .lanes { display: flex; flex-direction: column; overflow-y: auto; -webkit-overflow-scrolling: touch; touch-action: pan-y; }
.portrait .lane { flex: 0 0 auto; flex-direction: column; }
.portrait .kid { width: auto; flex-direction: row; justify-content: flex-start; gap: 12px; }
.portrait .lane .ava { width: clamp(36px, calc(var(--u) * 8.2), 70px); }
.portrait .tiles.n6, .portrait .tiles.n5 { --tc: 3; grid-auto-rows: auto; }
.portrait .tiles.n3 { grid-auto-rows: auto; }
.portrait .tile { aspect-ratio: 1 / 1.12; }
.portrait .tiles.n3 .tile { aspect-ratio: 1 / 1.3; }
.portrait .party { flex: 0 0 auto; flex-direction: column; gap: 14px; padding: 22px 16px; text-align: center; }
.portrait .msg { flex: 0 0 auto; align-items: center; }
.portrait .msg .big { white-space: normal; }
.portrait .offday { flex: 1 0 auto; flex-direction: column; text-align: center; }
.portrait .offday .orow { justify-content: center; }
.portrait .kinds { grid-template-columns: minmax(0, 1fr); }
.portrait .choose .kpic { width: calc(var(--u) * 16); height: calc(var(--u) * 16); }

/* ---------- 기록과 통계 ---------- */
.stats { height: 100%; display: flex; flex-direction: column; background: var(--ground); }
.sbar { flex: 0 0 auto; display: flex; align-items: center; flex-wrap: wrap; gap: 10px 16px; padding: calc(env(safe-area-inset-top) + 12px) max(16px, env(safe-area-inset-right)) 12px max(16px, env(safe-area-inset-left)); background: #FFFFFF; border-bottom: 2px solid var(--line); font-family: var(--font-display); }
.sbar h1 { font-size: 26px; font-weight: 400; white-space: nowrap; }
.pill { min-height: 48px; padding: 0 18px 0 10px; display: flex; align-items: center; gap: 4px; border-radius: 999px; background: #E9EDF5; font-size: 20px; white-space: nowrap; }
.pill svg { width: 24px; height: 24px; }
.seg2 { display: flex; gap: 4px; padding: 4px; border-radius: 16px; background: #E9EDF5; font-family: var(--font-display); }
.seg2 button { min-height: 44px; padding: 0 16px; display: flex; align-items: center; gap: 6px; border-radius: 12px; font-size: 19px; white-space: nowrap; }
.seg2 button.on { background: #FFFFFF; }
.seg2 svg { width: 26px; height: 26px; }
.note { flex: 0 0 auto; padding: 8px max(16px, env(safe-area-inset-right)) 8px max(16px, env(safe-area-inset-left)); background: #FFF3C4; font-size: 14px; }
.link { text-decoration: underline; font-weight: 700; min-height: 32px; }
.sbody { flex: 1 1 0; min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; touch-action: pan-y; padding: 20px max(16px, env(safe-area-inset-right)) max(20px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left)); }
.sbody.day { display: grid; grid-template-columns: minmax(300px, 396px) minmax(0, 1fr); gap: 20px; align-items: start; }
.col { display: flex; flex-direction: column; gap: 16px; min-width: 0; }

  st.setProperty('--fs-lbl', `${best.fs.toFixed(1)}px`); st.setProperty('--kid-w', `${best.kidW.toFixed(0)}px`);
  st.setProperty('--fs-name', `${cl(13, Math.min(best.uh * 4.6, side ? best.kidW / 3.3 : 99), N === 1 ? 56 : 40).toFixed(1)}px`);
  st.setProperty('--fs-count', `${cl(11, Math.min(best.uh * 2.9, side ? best.kidW / 4.9 : 99), 26).toFixed(1)}px`);

  el.classList.toggle('tight', tight);
  el.classList.toggle('solo', N === 1);

}

    <section><h3>쉬는 날</h3><p>주말과 공휴일은 쉬는 날이에요. 쉬는 날 아침에는 '교회 가는 날'(먹기·씻기·로션·옷·신발)과 '교회 안 가는 날'(먹기·씻기·로션) 중에서 골라요. 설, 부처님오신날, 추석과 대체공휴일은 지금 규정대로 2040년까지 들어 있어요. 방학이나 아픈 날, 선거일과 임시공휴일은 달력에서 바꿔 주세요.</p><button class="btn" data-act="open-cal">달력에서 쉬는 날 바꾸기</button></section>
    <section><h3>통계 미리 보기</h3><p>기록이 쌓이기 전에 통계 화면을 볼 수 있도록 지난 2주치 예시 기록을 넣어요. 언제든 지울 수 있어요.</p>${hasSample() ? '<button class="btn" data-act="sample-clear">예시 기록 지우기</button>' : '<button class="btn" data-act="sample-add">예시 기록 넣기</button>'}</section>
    <section><h3>기록 보관</h3><p>기록은 이 기기에만 저장돼요. 가끔 복사해서 메모나 메일에 붙여 두면 기기를 바꿀 때 되살릴 수 있어요.</p>
      <div class="row2"><button class="btn" data-act="backup">기록 복사하기</button><button class="btn" data-act="csv">엑셀용 표 복사하기</button><button class="btn" data-act="restore-open">복사해 둔 기록 되살리기</button></div></section>
    ${inFrame() ? '' : `<section><h3>홈 화면에 아이콘 만들기</h3><p>아이폰과 아이패드는 Safari의 공유 메뉴에서, 갤럭시는 크롬이나 삼성 인터넷의 메뉴에서 '홈 화면에 추가'를 고르세요.</p></section>`}
    ${inFrame() ? '' : `<section><h3>앱 새로 받기</h3><p>앱이 고쳐졌다는 안내를 받았을 때 눌러요. 인터넷에 연결되어 있어야 하고, 이름과 기록은 그대로 남아요.</p><button class="btn hold" data-act="refresh-app">앱 새로 받기 (꾹)</button></section>`}
    <section><h3>모든 기록 지우기</h3><button class="btn danger hold" data-act="wipe">모든 기록 지우기 (꾹)</button></section>
    <p class="ver" id="app-version">버전 ${APP_VERSION}</p>
  </div>`;
}
function modalHTML() {
  const m = ui.modal;
  if (!m) return '';
  if (m.type === 'settings') return settingsHTML();
  if (m.type === 'timer') {
    return `<div class="sheet confirm" role="dialog" aria-modal="true" aria-labelledby="tm-title"><h2 id="tm-title">${ROUTINE[ui.mode]} 준비 중이에요</h2>
      <p>${clock(m.start)}에 시작했어요. 잘못 시작했다면 오늘 ${ROUTINE[ui.mode]} 기록을 지우고 다시 시작할 수 있어요.</p>
      <div class="row2"><button class="btn" data-act="close">계속하기</button><button class="btn danger hold" data-act="reset" data-mode="${ui.mode}">다시 시작 (꾹)</button></div></div>`;
  }
  if (m.type === 'text') {
    return `<div class="sheet" role="dialog" aria-modal="true" aria-labelledby="tx-title"><div class="shead"><h2 id="tx-title">${m.title}</h2><button class="x" data-act="close" aria-label="닫기">×</button></div>
      <p>자동으로 복사하지 못했어요. 아래 글을 길게 눌러 모두 선택한 뒤 복사해 주세요.</p>
      <textarea class="area" id="copy-text" readonly>${esc(m.text)}</textarea></div>`;
  }
  if (m.type === 'restore') {
    return `<div class="sheet" role="dialog" aria-modal="true" aria-labelledby="rs-title"><div class="shead"><h2 id="rs-title">복사해 둔 기록 되살리기</h2><button class="x" data-act="close" aria-label="닫기">×</button></div>
      <p>'기록 복사하기'로 복사해 둔 글을 아래에 붙여 넣으세요. 지금 이 기기의 기록은 붙여 넣은 기록으로 바뀌어요.</p>
      <textarea class="area" id="restore-text" placeholder="여기에 붙여 넣기"></textarea>
      <div class="row2"><button class="btn" data-act="settings-open">취소</button><button class="btn danger hold" data-act="restore">되살리기 (꾹)</button></div></div>`;
  }
  if (m.type === 'kind') {
    return `<div class="sheet confirm" role="dialog" aria-modal="true" aria-labelledby="kd-title"><h2 id="kd-title">오늘 아침은 어떤 날인가요?</h2>
      ${kindButtons(kindOfDay(ui.today))}
      <div class="row2"><button class="btn hold" data-act="kind" data-kind="work">등원하는 날 (꾹)</button><button class="btn" data-act="close">닫기</button></div></div>`;
  }
  if (m.type === 'welcome') {
    return `<div class="sheet" role="dialog" aria-modal="true" aria-labelledby="wl-title"><h2 id="wl-title">누가 쓰나요?</h2>
      <p>아이 수와 이름, 색, 아이콘을 정해 주세요. 이 기기에만 저장되고, 나중에 설정에서 바꿀 수 있어요.</p>
      ${kidsEditorHTML()}
      <button class="btn" data-act="close">시작하기</button></div>`;
  }
  return '';
}

/* ------------------------------------------------------------------ 예시 기록, 내보내기 */
function seeded(seed) {
  return () => { seed = (seed + 0x6D2B79F5) | 0; let t = Math.imul(seed ^ (seed >>> 15), 1 | seed); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
}
function addSamples() {
  const r = seeded(20261120), today = fromKey(ui.today);
  const mins = {
    am: [{ eat: 19, wash: 5, lotion: 2.3, dress: 6, bag: 3, shoes: 3 }, { eat: 26, wash: 7, lotion: 2.5, dress: 9, bag: 3.4, shoes: 4.6 }],
    pm: [{ bath: 14, lotion: 2.5, pajama: 4 }, { bath: 16, lotion: 3, pajama: 6 }],
  };
  for (let i = 14; i >= 1; i--) {
    const d = new Date(today.getFullYear(), today.getMonth(), today.getDate() - i), key = dkey(d), off = isOff(key);
    const day = S.days[key] || (S.days[key] = {});
    ['am', 'pm'].forEach((mode) => {
      if (day[mode] && day[mode].start) return;
      const hour = mode === 'pm' ? 20 : off ? 8 : 7, minute = mode === 'pm' ? 2 : off ? 30 : 22;
      const start = new Date(d.getFullYear(), d.getMonth(), d.getDate(), hour, minute + Math.floor(r() * 18), Math.floor(r() * 60)).getTime();
      const se = { start, done: {}, sample: true };
      if (mode === 'am') se.kind = !off ? 'work' : kindOfDay(key) || (d.getDay() === 0 ? 'church' : 'home');   // 예시: 일요일은 교회 가는 날
      S.kids.forEach((k, ki) => {
        let t = start; se.done[k.id] = {};
        tasksFor(se, mode).forEach((task, ti) => {
          t += Math.round(mins[mode][ki % 2][task.id] * (1 + Math.floor(ki / 2) * 0.08) * (0.75 + r() * 0.5) * 60000);
          if (!(mode === 'pm' && i === 9 && ki === 1 && ti === 2)) se.done[k.id][task.id] = t;
        });
      });
      day[mode] = se;
    });
  }
  save();
}
function clearSamples() {
  Object.keys(S.days).forEach((k) => {
    ['am', 'pm'].forEach((m) => { if (S.days[k][m] && S.days[k][m].sample) delete S.days[k][m]; });
    if (!S.days[k].am && !S.days[k].pm) delete S.days[k];
  });
  save();
}
function tableText() {
  const rows = [['날짜', '요일', '구분', '아침 종류', '아이', '순서', '할 일', '시작', '완료', '걸린 시간(초)']];
  Object.keys(S.days).sort().forEach((key) => ['am', 'pm'].forEach((mode) => {
    const se = S.days[key][mode];
    if (!se || !se.start || se.sample) return;
    kids().forEach((k) => timeline(se, k.id, mode).items.forEach((it, j) => rows.push([key, WD[fromKey(key).getDay()], ROUTINE[mode], mode === 'am' ? KINDS[seKind(se)].name : '', nameOf(k), j + 1, it.t.name, hms(se.start), hms(it.at), Math.round(it.dur / 1000)])));
  }));
  return rows.map((r) => r.join('\t')).join('\n');
}
/* 설정의 '앱 새로 받기': 기기에 보관해 둔 앱 파일을 버리고 인터넷에서 새로 받는다. 이름과 기록은 건드리지 않는다. */
async function refreshApp() {
  toast('새 판을 받는 중이에요');
  try {
    const res = await fetch(`manifest.webmanifest?fresh=${now()}`, { cache: 'no-store' });
    if (!res.ok) throw new Error('offline');
    if (navigator.serviceWorker) { const reg = await navigator.serviceWorker.getRegistration(); if (reg) await reg.unregister(); }
    if (window.caches) { const keys = await caches.keys(); await Promise.all(keys.filter((k) => k.indexOf('dahaesseoyo') === 0).map((k) => caches.delete(k))); }
    location.reload();
  } catch (e) { toast('인터넷에 연결된 뒤에 다시 해 주세요'); }
}
async function copyOut(title, text) {
  try { await navigator.clipboard.writeText(text); toast('복사했어요'); }
  catch (e) { ui.modal = { type: 'text', title, text }; renderModal(); }
}

/* ------------------------------------------------------------------ 그리기 */
/* 윗줄이 화면보다 길어지면 날 종류는 그림만 남기고, 그래도 길면 요일을, 그래도 길면 시작 시각을 뺀다 */
function fitTop() {
  const top = $('.top');
  if (!top) return;
  top.classList.remove('tight1', 'tight2', 'tight3');
  for (const level of ['tight1', 'tight2', 'tight3']) {
    if (top.scrollWidth <= top.clientWidth) return;
    top.classList.add(level);
  }
}
function render() {
  app.innerHTML = ui.view === 'stats' ? statsHTML() : boardHTML();
  if (ui.view === 'board') { fitTop(); planLanes(); }
}
function renderModal() {
  const old = modalRoot.querySelector('.sheet'), top = old ? old.scrollTop : 0;
  modalRoot.innerHTML = modalHTML();
  const sheet = modalRoot.querySelector('.sheet');
  if (sheet) sheet.scrollTop = top;
}
function measure() {
  const W = Math.max(app.clientWidth || window.innerWidth || 0, 280), H = Math.max(app.clientHeight || window.innerHeight || 0, 280);
  app.classList.toggle('portrait', W < H);
  app.style.setProperty('--u', `${(W < H ? W * 0.0145 : Math.min(H, W * 0.72) / 100).toFixed(3)}px`);
  app.style.setProperty('--w', `${W}px`);
  if (ui.view === 'board') { fitTop(); planLanes(); }
}
function tick() {
  const t = now(), d = new Date(t), key = dkey(d), auto = autoMode(d);
  if (key !== ui.today || auto !== ui.auto) {
    if (key !== ui.today) { ui.peek = {}; if (ui.day === ui.today) { ui.day = key; ui.month = { y: d.getFullYear(), m: d.getMonth() }; } }
    ui.today = key; ui.auto = auto; ui.mode = auto;
    if (syncKind(key)) save();
    checkAlarm(t); render(); syncAwake();
    return;
  }
  const redraw = checkAlarm(t);
  if (ui.view !== 'board') return;
  if (redraw) { render(); return; }
  const c = $('#clock'), e = $('#elapsed'), se = sess(key, ui.mode, false);
  if (c) c.textContent = `${ampm(t)} ${clock(t)}`;
  if (e && se && se.start) {
    const txt = elapsedText(se, ui.mode, t, boardTasks(ui.mode));
    if (e.textContent !== txt) { e.textContent = txt; fitTop(); }
  }
}

/* ------------------------------------------------------------------ 누르기 */
function hintStart() {
  toast('시작 버튼을 먼저 눌러요');
  const b = $('#start');
  if (b) { b.classList.remove('pulse', 'shake'); void b.offsetWidth; b.classList.add('shake'); setTimeout(() => { b.classList.remove('shake'); b.classList.add('pulse'); }, 550); }
}
function act(el) {
  const a = el.dataset.act, key = ui.today, mode = ui.mode;
  switch (a) {
    case 'start': {
      const se = sess(key, mode, true);
      if (!se.start) {
        se.start = now();
        if (mode === 'am') se.kind = kindOfDay(key) || 'work';
        save(); sfx.start(); primeAlarm(); render(); syncAwake();
      }
      break;
    }
    case 'task': {
      const se = sess(key, mode, false);
      if (!se || !se.start) { hintStart(); break; }
      const kid = el.dataset.kid, task = el.dataset.task, id = kid + task, t = now();
      if (ui.lock[id] && Math.abs(t - ui.lock[id]) < 500) break;
      ui.lock[id] = t;
      const done = se.done[kid] || (se.done[kid] = {});
      if (done[task]) { delete done[task]; ui.just = null; ui.peek[kid] = false; sfx.undo(); }
      else {
        done[task] = Math.max(t, se.start);
        const complete = timeline(se, kid, mode, boardTasks(mode)).complete;
        ui.just = { kid, task, party: complete };
        if (complete) { ui.peek[kid] = false; sfx.party(); } else sfx.done();
      }
      save(); checkAlarm(t); render(); ui.just = null; syncAwake();
      break;
    }
    case 'peek': ui.peek[el.dataset.kid] = true; render(); break;
    case 'unpeek': ui.peek[el.dataset.kid] = false; render(); break;
    case 'mode': ui.mode = el.dataset.mode; render(); syncAwake(); break;
    case 'kind': setKind(key, el.dataset.kind); ui.modal = null; ui.peek = {}; checkAlarm(now()); renderModal(); render(); syncAwake(); break;
    case 'kind-open': ui.modal = { type: 'kind' }; renderModal(); break;
    case 'alarm-off': {
      const se = sess(key, 'am', false);
      if (se) { se.alarmOff = now(); save(); }
      if (!checkAlarm(now()) && ring) { ring = null; stopSound(); renderAlarm(); }
      if (ui.view === 'board') render();
      break;
    }
    case 'alarm-on': S.alarm.on = !S.alarm.on; save(); if (!S.alarm.on) stopSound(); checkAlarm(now()); renderModal(); render(); break;
    case 'alarm-min': S.alarm.min = cl(5, S.alarm.min + Number(el.dataset.step), 90); save(); checkAlarm(now()); renderModal(); render(); break;
    case 'alarm-test': testAlarm(); break;
    case 'refresh-app': refreshApp(); break;
    case 'ckind': ui.ck = el.dataset.kind; render(); break;
    case 'timer': { const se = sess(key, mode, false); if (se && se.start) { ui.modal = { type: 'timer', start: se.start }; renderModal(); } break; }
    case 'reset': {
      const m = el.dataset.mode, day = S.days[key];
      if (day && day[m]) { delete day[m]; if (!day.am && !day.pm) delete S.days[key]; }
      ui.peek = {}; ui.modal = null; save(); checkAlarm(now()); render(); renderModal(); syncAwake(); toast(`${ROUTINE[m]} 기록을 지웠어요`);
      break;
    }
    case 'stats': if (mode === 'am' && kindOfDay(key)) ui.ck = kindOfDay(key);
      ui.view = 'stats'; ui.day = key; ui.month = { y: fromKey(key).getFullYear(), m: fromKey(key).getMonth() }; ui.sr = mode; ui.cr = mode; render(); break;
    case 'back': ui.view = 'board'; render(); break;
    case 'tab': ui.tab = el.dataset.tab; render(); break;
    case 'pick': ui.day = el.dataset.day; render(); break;
    case 'month': { const d = new Date(ui.month.y, ui.month.m + Number(el.dataset.step), 1); ui.month = { y: d.getFullYear(), m: d.getMonth() }; render(); break; }
    case 'pickr': ui[el.dataset.name] = el.dataset.mode; render(); break;
    case 'period': ui.period = el.dataset.period; render(); break;
    case 'toggle-off': {
      const want = !isOff(ui.day);
      if (want === autoOff(ui.day)) delete S.off[ui.day]; else S.off[ui.day] = want;
      if (ui.day === ui.today) syncKind(ui.today);
      save(); checkAlarm(now()); render();
      break;
    }
    case 'settings': case 'settings-open': ui.modal = { type: 'settings' }; ui.pick = null; renderModal(); break;
    case 'close': ui.modal = null; ui.pick = null; renderModal(); render(); break;
    case 'count': S.count = cl(1, S.count + Number(el.dataset.step), MAX_KIDS); ui.pick = null; ui.peek = {}; save(); checkAlarm(now()); renderModal(); render(); syncAwake(); break;
    case 'pick-icon': { const i = Number(el.dataset.i); ui.pick = ui.pick === i ? null : i; renderModal(); break; }
    case 'set-color': S.kids[Number(el.dataset.i)].color = el.dataset.color; save(); renderModal(); render(); break;
    case 'set-icon': S.kids[Number(el.dataset.i)].icon = el.dataset.icon; ui.pick = null; save(); renderModal(); render(); break;
    case 'sound': S.sound = !S.sound; save(); renderModal(); if (S.sound) sfx.done(); break;
    case 'open-cal': ui.modal = null; ui.view = 'stats'; ui.tab = 'day'; renderModal(); render(); break;
    case 'sample-add': addSamples(); renderModal(); render(); toast('예시 기록을 넣었어요'); break;
    case 'sample-clear': clearSamples(); renderModal(); render(); toast('예시 기록을 지웠어요'); break;
    case 'backup': copyOut('기록 복사하기', JSON.stringify(S)); break;
    case 'csv': copyOut('엑셀용 표 복사하기', tableText()); break;
    case 'restore-open': ui.modal = { type: 'restore' }; renderModal(); break;
    case 'restore': {
      try {
        const raw = JSON.parse($('#restore-text').value);
        if (!raw || typeof raw.days !== 'object') throw new Error('shape');
        S = normalize(raw); save(); ui.modal = null; ui.peek = {}; checkAlarm(now()); renderModal(); render(); toast('기록을 되살렸어요');
      } catch (e) { toast('붙여 넣은 글을 읽지 못했어요'); }
      break;
    }
    case 'wipe': S = normalize({ kids: S.kids, count: S.count, sound: S.sound, alarm: S.alarm }); save(); ui.modal = null; ui.peek = {}; checkAlarm(now()); renderModal(); render(); toast('모든 기록을 지웠어요'); break;
    default: break;
  }
}

let holdTimer = null, holdEl = null;
function cancelHold() { if (holdEl) holdEl.classList.remove('holding'); clearTimeout(holdTimer); holdTimer = null; holdEl = null; }
document.addEventListener('pointerdown', (e) => {
  const b = e.target.closest && e.target.closest('.hold');
  if (!b || b.disabled) return;
  cancelHold(); holdEl = b; b._held = false; b.classList.add('holding');
  holdTimer = setTimeout(() => { const el = holdEl; if (!el) return; el._held = true; cancelHold(); act(el); }, 800);
});
document.addEventListener('pointerup', cancelHold);
document.addEventListener('pointercancel', cancelHold);
document.addEventListener('pointerleave', (e) => { if (e.target === holdEl) cancelHold(); }, true);
document.addEventListener('click', (e) => {
  unlockAudio();
  const b = e.target.closest && e.target.closest('[data-act]');
  if (!b || b.disabled) return;
  if (b.classList.contains('hold')) {
    if (b._held) { b._held = false; return; }
    if (e.detail === 0) { act(b); return; }      // 키보드로 누른 경우
    toast('꾹 눌러 주세요');
    return;
  }
  act(b);
});
modalRoot.addEventListener('input', (e) => {
  const i = e.target.dataset && e.target.dataset.name;
  if (i === undefined) return;
  S.kids[Number(i)].name = e.target.value.trim().slice(0, 6); save(); render(); if (ring) renderAlarm();
});
modalRoot.addEventListener('click', (e) => { if (e.target === modalRoot && ui.modal && ui.modal.type !== 'welcome') { ui.modal = null; ui.pick = null; renderModal(); render(); } });
document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && ui.modal && ui.modal.type !== 'welcome') { ui.modal = null; ui.pick = null; renderModal(); render(); } });
document.addEventListener('contextmenu', (e) => { if (!(e.target.closest && e.target.closest('input, textarea'))) e.preventDefault(); });
document.addEventListener('visibilitychange', () => { if (!document.hidden) { tick(); syncAwake(); } });

/* ------------------------------------------------------------------ 시작 */
if (syncKind(ui.today)) save();
measure();
checkAlarm(now());
render();
if (kids().every((k) => !k.name) && !Object.keys(S.days).length) { ui.modal = { type: 'welcome' }; renderModal(); }
setInterval(tick, 1000);
window.addEventListener('resize', measure);
if (window.ResizeObserver) new ResizeObserver(measure).observe(app);
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { if (ui.view === 'board') { fitTop(); planLanes(); } });
syncAwake();
try {
  if ('serviceWorker' in navigator && location.protocol === 'https:' && !inFrame()) navigator.serviceWorker.register('sw.js').catch(() => {});
} catch (e) { /* 설치 기능이 없는 곳에서는 그냥 웹 페이지로 동작 */ }
})();
</script>
